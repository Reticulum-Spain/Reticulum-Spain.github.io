---
# Optional local checks, run on every `git commit` once enabled with
# `pre-commit install --hook-type pre-commit --hook-type commit-msg`.
# CI does not run them; the `Test deployment` build is what gates PRs.

# tsconfig.json allows comments (JSONC), which check-json rejects
exclude: "tsconfig.json"
fail_fast: true
repos:
  # Checks that commit messages follow Conventional Commits (feat:, fix:, ...)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.6.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg

  # Fails if any `exclude` pattern in this file no longer matches a file
  - repo: meta
    hooks:
      - id: check-useless-excludes

  # Formats CSS, JS, Markdown and JSON
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(css|js|md|markdown|json)

  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files # blocks files over 10 MB
        args: [--maxkb=10000]
      - id: check-case-conflict # names that clash on case-insensitive filesystems (macOS, Windows)
      - id: check-executables-have-shebangs
      - id: check-json # JSON syntax
      - id: check-merge-conflict # leftover <<<<<<< / >>>>>>> markers
      - id: check-symlinks # broken symlinks
      - id: check-vcs-permalinks # GitHub links pinned to a commit, not a branch
      - id: check-xml # XML/SVG syntax
      - id: check-yaml # YAML syntax (--unsafe: only parse, don't build objects)
        args: [--unsafe]
      - id: end-of-file-fixer # files end with exactly one newline
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key # stops committing SSH/TLS private keys
      - id: check-byte-order-marker

  # Formats YAML (workflows, blog/tags.yml...) with consistent indentation
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        args: [--mapping, "2", --sequence, "4", --offset, "2", "--preserve-quotes"]
